name: Update profile visuals

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight (UTC)
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

jobs:
  summary-cards:
    name: Generate GitHub stats cards
    runs-on: ubuntu-latest
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 1

  snake:
    name: Generate Nokia 3310 snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Nokia 3310 LCD look: pale green screen, dark green pixels
          outputs: |
            dist/nokia-snake.gif?color_snake=#1f2a1c&color_dots=#b4dcc2,#94b89d,#728f79,#566e59,#3a4a36&color_background=#c7f0d8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
